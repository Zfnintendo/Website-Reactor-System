<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Reactor System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="src/mainScript.js" defer></script>

</head>
<body>

    <div class="Title">
        <h1>Website Reactor System</h1>
        <h4>A simplified reactor system!</h4>
    </div>

    <br>

    <div class="Controls">

        <div class="ReactorPanel">
            <h2>Temperature: 323K</h2>
        </div>

        <div class="TempControls">
            <h2>Rods</h2>

            <h3>Insertion: 50%</h3>

            <div class="RodControls">
                <div class="Rods">
                    <h4>Raise Rods</h4>
                    <h4>Lower Rods</h4>  
                </div>

                <div class="Slider">
                    <input type="range" min="0" max="2" value="1">
                </div>
            </div>

        </div>

        <div class="Coolants">
            <h2>Coolant Valves</h2>

            <div class="Coolant1">
                <h4>Coolant Valve 1</h4>
                <button></button>
            </div>

            <div class="Coolant2">
                <h4>Coolant Valve 2</h4>
                <button></button>
            </div>

        </div>

        <div class="Feedwater">
            <h2>Feedwater</h2>
            <button></button>
        </div>

        <div class="ReliefValves">
            <h2>Relief Valves</h2>

            <div class="RV1">
                <h4>Relief Valve 1</h4>
                <button></button>
            </div>

            <div class="RV2">
                <h4>Relief Valve 2</h4>
                <button></button>
            </div>

            <div class="RV3">
                <h4>Relief Valve 3</h4>
                <button></button>
            </div>

            <div class="RV4">
                <h4>Relief Valve 4</h4>
                <button></button>
            </div>

        </div>
    </div>


</body>
</html>
